# Контекстные проверки по картинке слайда. Вопросы — из Приложения 1 ТЗ.
#
# Почему по картинке, а не по тексту SlideIR: текст показывает намерение, а не
# результат. Обрезанный краем слайда абзац, наложившиеся блоки, приехавшая от
# чужого слайда иконка — ничего из этого в тексте не видно вовсе. Колода,
# проверенная только по тексту, не проверена.
#
# Разрешение картинки задаётся в конфиге (audit.contextual_dpi): токены растут
# как площадь, и 150 dpi стоит вчетверо дороже 72 при том же ответе.
name: audit_slide
version: "3"
step: audit_slide
description: >
  Отвечает «да/нет» на контекстные вопросы Приложения 1 по картинке одного
  слайда. Объяснение — только у ответа «нет»: находкой становится только он.
  v2: v1 объяснял и «да» — ~415 токенов ответа на слайд при лимите аккаунта
  40 000 токенов в минуту, а объяснения «да» никуда не шли.
  v3: модель знает тему колоды и правило про чужое фото. В v2 она видела
  только заголовок слайда, и студент за компьютером на слайде «Выручка
  достигла 47,3 млн руб.» проходил как уместная иллюстрация: по правилу
  «сомнение — это да» ответ был «да» на семи слайдах из одиннадцати.
template: |
  Перед тобой картинка одного слайда деловой презентации.

  Тема всей презентации: {topic}
  Заголовок слайда: {title}
  Намерение слайда: {intent}
  Текст слайда, как его задумала вёрстка:
  {body}

  Ответь на каждый вопрос строго «да» или «нет», глядя на картинку.

  {questions}

  Правила ответа:
  - «нет» ставь только тогда, когда видишь проблему на картинке. Сомнение —
    это «да» с низкой уверенностью, а не «нет».
  - при «нет» в `reason` одной фразой пиши, что именно видно, а не
    пересказывай вопрос. При «да» `reason` оставляй пустым.
  - `confidence` от 0 до 1: насколько ты уверен в своём ответе.
  - отвечай только про этот слайд, не про колоду.
  - content.visuals_on_topic: фото или иллюстрация, чей предмет не связан с
    темой презентации (люди, предметы, сцены из другой области: студент за
    учебниками на слайде о продажах), — это «нет», даже если картинка
    выглядит уместной как оформление. Логотип, фирменный декор и значки
    шаблона — не иллюстрация, про них ответ «да».
