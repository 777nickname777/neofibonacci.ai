# Промпт планировщика. Версия 5.
#
# Что изменилось против v4: вход больше не только контент-пакет датасета.
# Короткий бриф в две фразы, длинный документ, JSON чужой структуры — после
# разбора (`ingest_content`) материалов бывает и много, и почти ничего.
# Отсюда три правки:
# - число слайдов выбирает модель в границах ТЗ, по объёму материала;
# - запрос пользователя передаётся его словами, и цитаты — списком;
# - если фактов с числами нет, чисел на слайдах нет: содержание строится из
#   брифа и общих знаний, но без выдуманных цифр, дат, имён и клиентов.
name: plan_deck
version: "5"
step: plan_deck
description: >
  По брифу и контент-пакету строит DeckPlan: состав слайдов, их порядок,
  намерение каждого и содержательные блоки — до всякой вёрстки. Соблюдает
  ограничения длины, снятые с шаблона, и пороги плотности из ТЗ.
template: |
  Ты выстраиваешь структуру деловой презентации.

  Тема: {topic}
  Назначение: {purpose}
  Аудитория: {audience}
  Цель: {goal}
  Язык: {language}
  Дополнительно: {extra_instructions}

  Запрос пользователя его словами:
  {request}

  Исходные материалы — факты:
  {facts}

  Исходные материалы — числовые ряды:
  {series}

  Исходные материалы — цитаты:
  {quotes}

  Собери план на {slide_count} слайдов.

  ОГРАНИЧЕНИЯ ДЛИНЫ. Их задаёт шаблон, в который слайды будут свёрстаны;
  текст длиннее не поместится в рамку и будет обрезан:
  {length_limits}

  ПРАВИЛА СОДЕРЖАНИЯ:
  - Заголовок каждого слайда — вывод, а не название темы. Пиши
    «Выручка выросла на 34 % за квартал», а не «Выручка».
  - На слайде с данными (блоки series, kpi, table) заголовок называет
    изменение и его числа: «Время обнаружения сократилось с 42 до 9 минут»,
    а не «Динамика улучшения показателей». Эти числа объяви в figures.
  - Первый слайд — титульный, последний — завершающий.
  - Содержательный слайд обязан иметь блоки: слайд с одним заголовком
    не считается слайдом.
  - Пиши на языке {language}.

  ПРАВИЛА ЧИСЕЛ. Каждое число, вынесенное на слайд, перечисли в поле figures
  этого слайда с указанием происхождения:
  - kind "cited" — число взято из материалов как есть; укажи fact_ids.
  - kind "derived" — число выведено из материалов; укажи fact_ids и formula,
    выражение над идентификаторами фактов: например "f1 / f3".
    В формуле допустимы только идентификаторы фактов, числа и знаки + - * /.
  Числа, которых нет в материалах и которые из них не выводятся, не пиши
  вовсе. Это касается и заголовков: «сократилось в 4.6 раза» — выведенное
  число, и оно тоже объявляется в figures.

  ЕСЛИ МАТЕРИАЛОВ МАЛО. Когда фактов немного или это только бриф, строй
  содержание из брифа и общих знаний о предмете: проблема, решение, как это
  работает, польза для аудитории, шаги внедрения, призыв к действию. Но
  никаких чисел, процентов, сроков, сумм, дат, имён, названий клиентов и
  цитат, которых нет в материалах: такие слайды пишутся словами. Заголовок-
  вывод без чисел — «Протокол встречи готов сразу после созвона», а не
  «Протокол готов за 5 минут».

  ЦИТАТЫ. Блок kind "quote" ссылается на цитату по идентификатору в
  quote_id; текст цитаты не переписывай.

  ПРАВИЛА ТАБЛИЦ. Блок kind "table" обязан нести объект table с полями
  columns и rows; rows — список списков ячеек по числу колонок. Не складывай
  таблицу в items строками с разделителями.

  ПРАВИЛА ДАННЫХ. Блок kind "series" ссылается на числовой ряд по
  идентификатору в series_ids.

  ФОРМАТ ОТВЕТА. Не выводи поля с пустым значением: пустые списки [],
  null и пустые строки "" опускай целиком — они подставятся сами. Каждый
  лишний символ ответа — секунды ожидания.
