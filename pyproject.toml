[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deckwright"
version = "0.1.0"
description = "Digital presentation designer: reads an arbitrary .pptx template as a rule set and builds new slides from it"
requires-python = ">=3.11"
dependencies = [
    "python-pptx==1.0.2",
    "lxml==6.1.3",
    "fonttools==4.65.0",
    "Pillow==12.3.0",
    "pydantic==2.13.5",
    "PyYAML==6.0.3",
    "openai==3.16.2",
    "pdfplumber==0.11.10",
    "python-docx==1.2.0",
    "streamlit==1.64.0",
]

[project.optional-dependencies]
# fpdf2 — только генератор PDF-входа для тестов (tests/fixtures/make_inputs.py):
# LibreOffice в образе без Writer и docx в PDF не переводит.
dev = ["pytest==9.0.1", "ruff==0.15.1", "fpdf2==2.8.3"]

[project.scripts]
deckwright = "deckwright.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# RUF001-003 ловят кириллицу, визуально похожую на латиницу. Документация и
# комментарии в проекте на русском, поэтому правило даёт только шум.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
