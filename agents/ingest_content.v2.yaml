# Агент разбора входа: бриф и файлы в любом виде → ContentPack.
#
# Агент — шаг пайплайна, который обращается к модели, описанный целиком:
# какая модель, каким промптом, с какими параметрами запроса и в каких
# пределах. Версия агента меняется при любой правке этого файла; версия и
# хэш файла пишутся в манифест прогона (`RunManifest.agents`).
name: ingest_content
version: "2"
step: ingest_content
description: >
  Приводит бриф, документы и JSON чужой структуры к контент-пакету: факты,
  ряды, цитаты. Числа ответа сверяются с текстом входа (content/grounding.py).
  Версия 2: материал отделён от задачи явной рамкой — указания внутри
  загруженного документа остаются его текстом, а не командой модели.
# Endpoint из config.yaml: llm — текстовая модель, vlm — модель со зрением.
endpoint: llm
# Модель. Имя — из окружения (.env), как и ключ: сменить модель можно без
# правки кода и без новой версии агента, но манифест запишет, какая была.
model: ${LLM_MODEL}
prompt: ingest_content.v3
params:
  temperature: 0.1
  # Контент-пакет на 20 фактов — около 3 000 токенов; с запасом.
  max_tokens: 5000
  enable_thinking: false
limits:
  timeout_seconds: 120
  # Повторы после ответа, не прошедшего Pydantic-схему (ContentPack).
  max_retries: 3
