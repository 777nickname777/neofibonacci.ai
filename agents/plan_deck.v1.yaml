# Агент планирования: контент-пакет → DeckPlan (состав, порядок, блоки).
name: plan_deck
version: "1"
step: plan_deck
description: >
  Строит план колоды до вёрстки: намерение и заголовок-вывод каждого слайда,
  блоки и данные. Длины — по бюджету, снятому с шаблона.
endpoint: llm
model: ${LLM_MODEL}
prompt: plan_deck.v6
params:
  temperature: 0.4
  max_tokens: 6000
  enable_thinking: false
limits:
  timeout_seconds: 120
  max_retries: 3
  # Дубль запроса, если за 60 с нет ответа; берётся первый ответ.
  # 60 с — выше обычного вызова (47.5–53.9 с на четырёх из шести живых)
  # и ниже медленных (89.8 и 194.9 с). Два запроса резервируют в окне
  # ограничителя 2 × 8.7 тыс. токенов из 40 тыс.: ждать не приходится.
  hedge_after_seconds: 60
  # Потолок времени на повторы невалидных ответов. Четыре попытки по 120 с —
  # восемь минут при бюджете колоды в пять: хостинг снимает прогон раньше,
  # чем шаг сдастся. 150 с оставляют две-три попытки при обычном вызове в
  # 47.5-53.9 с и обрывают безнадёжный случай внутри бюджета.
  retry_budget_seconds: 150
