# Живой вызов модели. Запускается вручную и только вручную: ключ платный,
# а на каждом коммите это ни к чему — обычный CI ходит по записанным ответам.
#
# Ключ лежит в секретах репозитория и в логи не попадает: GitHub маскирует
# значения секретов в выводе.
name: LLM probe

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Идентификатор модели"
        required: false
        default: "Qwen/Qwen3.6-27B"
      base_url:
        description: "Базовый URL OpenAI-совместимого endpoint'а"
        required: false
        # У SiliconFlow два независимых сервиса, .com и .cn, с разными
        # аккаунтами и невзаимозаменяемыми ключами. Здесь тот, на котором
        # заведён аккаунт проекта.
        default: "https://api.siliconflow.com/v1"
      price_in:
        description: "Перекрыть цену за 1M входных токенов, USD (пусто = из config.yaml)"
        required: false
        default: ""
      price_out:
        description: "Перекрыть цену за 1M выходных токенов, USD (пусто = из config.yaml)"
        required: false
        default: ""
      repeats:
        description: "Сколько раз подряд прогнать планировщик (разброс важнее одного замера)"
        required: false
        default: "3"
      enable_thinking:
        description: "Включить режим рассуждений (проверить, снимается ли блок <think>)"
        required: false
        default: "false"
      audit:
        description: "Вместо планирования прогнать живой аудит по картинкам слайдов"
        required: false
        default: "false"
      audit_slides:
        description: "Сколько слайдов спросить в аудите (0 — всю колоду)"
        required: false
        default: "4"
      full_run:
        description: "Прямой замер бюджета: три варианта с аудитом и циклом исправления"
        required: false
        default: "false"
      rewrite:
        description: "Прогнать переписывание текста моделью по находке аудита (главный сценарий демо)"
        required: false
        default: "false"
      rewrite_findings:
        description: "Сколько находок переписать (0 — все)"
        required: false
        default: "1"
      new_inputs:
        description: "Четыре новых входа (бриф, docx, pdf, чужой JSON) на всех шаблонах: true — все, `вход:шаблон[,вход:шаблон…]` — выбранные пары (brief:vk_tech,docx:zelenie_investicii)"
        required: false
        default: "false"
      template:
        description: "Шаблон: путь в репозитории или `synthetic` для собираемого на месте"
        required: false
        default: "data/templates/vk_tech.pptx"

jobs:
  probe:
    name: живой вызов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Системные зависимости
        run: sh scripts/install-system-deps.sh

      - name: Установка
        run: pip install -e ".[dev]"

      - name: Режим рассуждений по входным данным запуска
        run: |
          python - <<'PY'
          import os, pathlib, yaml
          path = pathlib.Path("configs/config.yaml")
          cfg = yaml.safe_load(path.read_text(encoding="utf-8"))
          want = os.environ["ENABLE_THINKING"].strip().lower() == "true"
          cfg["llm"]["steps"]["plan_deck"]["enable_thinking"] = want
          path.write_text(yaml.safe_dump(cfg, allow_unicode=True, sort_keys=False), encoding="utf-8")
          print("enable_thinking =", want)
          PY
        env:
          ENABLE_THINKING: ${{ inputs.enable_thinking }}

      # Главный сценарий демонстрации: находка «текст не помещается» → выбор
      # человека → модель переписывает → пересборка → повторный аудит.
      # Механика закрыта тестами на подставной модели; здесь проверяется
      # единственное, чего тестом не проверить: пишет ли настоящая модель
      # текст, проходящий рамки бюджета и запрет на новые числа.
      - name: Живое переписывание текста по находке
        if: ${{ inputs.rewrite == 'true' }}
        env:
          LLM_BASE_URL: ${{ inputs.base_url }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ inputs.model }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::Секрет LLM_API_KEY не задан."
            exit 1
          fi
          if [ "${{ inputs.template }}" = "synthetic" ]; then
            python tests/fixtures/make_template.py probe-templates/synthetic.pptx
            TEMPLATE=probe-templates/synthetic.pptx
          else
            TEMPLATE="${{ inputs.template }}"
          fi
          test -f "$TEMPLATE" || { echo "::error::нет шаблона $TEMPLATE"; exit 1; }
          deckwright rewrite-probe \
            --template "$TEMPLATE" \
            --content tests/fixtures/content_pack.json \
            --findings "${{ inputs.rewrite_findings }}" \
            --output probe-out/rewrite

      - name: Живой аудит по картинкам слайдов
        if: ${{ inputs.audit == 'true' && inputs.rewrite != 'true' }}
        env:
          LLM_BASE_URL: ${{ inputs.base_url }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ inputs.model }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::Секрет LLM_API_KEY не задан."
            exit 1
          fi
          if [ "${{ inputs.template }}" = "synthetic" ]; then
            python tests/fixtures/make_template.py probe-templates/synthetic.pptx
            TEMPLATE=probe-templates/synthetic.pptx
          else
            TEMPLATE="${{ inputs.template }}"
          fi
          test -f "$TEMPLATE" || { echo "::error::нет шаблона $TEMPLATE"; exit 1; }
          # --spoil обязателен: аудит, который всегда доволен, проходит все
          # тесты и бесполезен. Без заведомо испорченной колоды прогон не
          # отвечает на главный вопрос.
          deckwright audit-probe \
            --template "$TEMPLATE" \
            --content tests/fixtures/content_pack.json \
            --slides "${{ inputs.audit_slides }}" \
            --spoil \
            --output probe-out/audit \
            --save probe-out/audit-probe.json

      - name: Диагностический вызов
        if: ${{ inputs.audit != 'true' && inputs.rewrite != 'true' && inputs.new_inputs == 'false' }}
        env:
          LLM_BASE_URL: ${{ inputs.base_url }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ inputs.model }}
          PRICE_IN: ${{ inputs.price_in }}
          PRICE_OUT: ${{ inputs.price_out }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::Секрет LLM_API_KEY не задан. Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          ARGS=""
          if [ -n "$PRICE_IN" ] && [ -n "$PRICE_OUT" ]; then
            ARGS="--price-in $PRICE_IN --price-out $PRICE_OUT"
          fi
          # Шаблон обязателен: без него в промпт не уйдут ограничения
          # длины, и проба проверит не тот промпт, который работает в
          # настоящем прогоне.
          if [ "${{ inputs.template }}" = "synthetic" ]; then
            python tests/fixtures/make_template.py probe-templates/synthetic.pptx
            TEMPLATE=probe-templates/synthetic.pptx
          else
            TEMPLATE="${{ inputs.template }}"
          fi
          test -f "$TEMPLATE" || { echo "::error::нет шаблона $TEMPLATE"; exit 1; }
          deckwright probe \
            --content tests/fixtures/content_pack.json \
            --template "$TEMPLATE" \
            --repeats "${{ inputs.repeats }}" \
            --save probe-out/plan_deck.json \
            $ARGS

      # Артефакт лежит на хранилище, куда закрыт доступ из среды разработки,
      # поэтому полученный план дублируется в лог: оттуда его можно взять как
      # настоящую фикстуру вместо рукописной.
      - name: Полученный план целиком
        if: ${{ always() && inputs.audit != 'true' && inputs.rewrite != 'true' && inputs.new_inputs == 'false' }}
        run: |
          if [ -f probe-out/plan_deck.json ]; then
            echo "----- НАЧАЛО plan_deck.json -----"
            cat probe-out/plan_deck.json
            echo "----- КОНЕЦ plan_deck.json -----"
          else
            echo "плана нет: диагностический вызов не дошёл до сохранения"
          fi

      # Прямой замер бюджета A18: генерация трёх вариантов вместе, с
      # картиночным аудитом и циклом исправления — как в интерфейсе. Модель
      # со зрением та же, что в audit-probe. Итог — последняя строка лога
      # («генерация вариантов … из 300с») и probe-out/deck/run-summary.json.
      - name: Сквозной прогон на живой модели
        if: ${{ inputs.full_run == 'true' && inputs.rewrite != 'true' }}
        env:
          LLM_BASE_URL: ${{ inputs.base_url }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ inputs.model }}
          VLM_BASE_URL: ${{ inputs.base_url }}
          VLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          VLM_MODEL: ${{ inputs.model }}
        run: |
          if [ "${{ inputs.template }}" = "synthetic" ]; then
            python tests/fixtures/make_template.py probe-templates/synthetic.pptx
            TEMPLATE=probe-templates/synthetic.pptx
          else
            TEMPLATE="${{ inputs.template }}"
          fi
          test -f "$TEMPLATE" || { echo "::error::нет шаблона $TEMPLATE"; exit 1; }
          deckwright run \
            --template "$TEMPLATE" \
            --content tests/fixtures/content_pack.json \
            --fix auto \
            --output probe-out/deck

      # Проверка приёма входа на контенте, которого нет в датасете: короткий
      # бриф, длинный docx, PDF с таблицей, JSON чужой структуры — каждый на
      # всех шаблонах. Прогоны идут подряд, а не параллельно: у аккаунта один
      # минутный лимит токенов на всех, и параллельные прогоны мерили бы
      # очередь, а не прогон. Время — полное, с разбором входа (бюджет 300 с
      # на колоду). Контент-пакет, план и сводка аудита уходят в лог: артефакты
      # из среды разработки недоступны, а по плану колода собирается заново.
      - name: Новые входы на всех шаблонах
        if: ${{ inputs.new_inputs != 'false' }}
        env:
          LLM_BASE_URL: ${{ inputs.base_url }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ inputs.model }}
          VLM_BASE_URL: ${{ inputs.base_url }}
          VLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          VLM_MODEL: ${{ inputs.model }}
          ONLY: ${{ inputs.new_inputs }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::Секрет LLM_API_KEY не задан."
            exit 1
          fi
          python tests/fixtures/make_inputs.py probe-inputs
          for INPUT in brief docx pdf json; do
            for TEMPLATE in data/templates/vk_tech.pptx data/templates/vk_workspace.pptx \
                            data/templates/vk_education.pptx data/holdout/zelenie_investicii.pptx; do
              NAME=$(basename "$TEMPLATE" .pptx)
              if [ "$ONLY" != "true" ] && [[ ",$ONLY," != *",$INPUT:$NAME,"* ]]; then
                continue
              fi
              OUT="probe-out/new/$INPUT/$NAME"
              mkdir -p "$OUT"
              python - "$INPUT" > "$OUT/args" <<'PY'
          import json, shlex, sys
          spec = json.load(open("probe-inputs/inputs.json", encoding="utf-8"))[sys.argv[1]]
          args = ["--purpose", spec["purpose"]]
          if spec["text"]:
              args += ["--brief", spec["text"]]
          for name in spec["files"]:
              args += ["--input", f"probe-inputs/{name}"]
          print(shlex.join(args))
          PY
              echo "===== ПРОГОН $INPUT × $NAME ====="
              eval deckwright run --template "$TEMPLATE" $(cat "$OUT/args") \
                --fix auto --output "$OUT" \
                --save-pack "$OUT/pack.json" --save-plan "$OUT/plan.json" \
                > "$OUT/run.log" 2>&1 || echo "прогон упал: код $?"
              grep -E '^\[(вход|прогон)\]|ВНЕ|Traceback|Error' "$OUT/run.log" || true
              python - "$OUT" <<'PY'
          import collections, glob, json, pathlib, sys
          out = pathlib.Path(sys.argv[1])
          summary = {}
          for path in sorted(glob.glob(str(out / "*" / "*.audit.json"))):
              report = json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
              issues = report.get("issues", report)
              counts = collections.Counter(
                  f"{i['severity']}:{i['check_id']}" for i in issues
              )
              summary[pathlib.Path(path).stem] = {
                  "counts": dict(counts),
                  "errors": [
                      f"{i['slide_index']}: {i['check_id']}: {i['message'][:160]}"
                      for i in issues if i["severity"] == "error"
                  ],
              }
          # Лог читается через get_job_logs, а он отдаёт не больше 5000 строк
          # с конца. JSON с отступами — строка на поле, ~600 строк на пару, и
          # полный прогон 4×4 обрезался наполовину. Здесь строка на элемент
          # списка верхнего уровня (слайд, факт, ряд) — ~50 строк на пару.
          def dump(value):
              return json.dumps(value, ensure_ascii=False, separators=(",", ":"))
          def compact(obj):
              if not isinstance(obj, dict):
                  return dump(obj)
              parts = []
              for key, value in obj.items():
                  if isinstance(value, list) and value:
                      body = ",\n".join(dump(item) for item in value)
                      parts.append(f"{dump(key)}:[\n{body}\n]")
                  else:
                      parts.append(f"{dump(key)}:{dump(value)}")
              return "{" + ",\n".join(parts) + "}"
          print("----- НАЧАЛО audit -----")
          print(json.dumps(summary, ensure_ascii=False))
          print("----- КОНЕЦ audit -----")
          for name in ("run-summary.json", "pack.json", "plan.json"):
              path = out / name
              print(f"----- НАЧАЛО {name} -----")
              print(compact(json.loads(path.read_text(encoding="utf-8"))) if path.exists() else "(нет)")
              print(f"----- КОНЕЦ {name} -----")
          PY
            done
          done

      - name: Результаты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-probe-${{ github.run_number }}
          path: probe-out/
          retention-days: 14
          # Диагностический прогон может упасть до записи результатов — например,
          # если endpoint не принял ключ. Это не повод помечать шаг проблемным:
          # сам отчёт уже в логе.
          if-no-files-found: ignore
